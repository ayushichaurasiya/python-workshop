<html>
    <head>
        <script>
         function demo1 ()
       {
            document.getElementById("b1").style.background="red"
       }
       function demo2 ()
       {
            document.getElementById("b1").style.background="yellow"
       }
        function demo3 ()
       {
            document.getElementById("b1").style.background="green"
       }
 </script>
    </head>
    
    <body id="b1">
        <input type="button"  value="red" onclick="demo1()">
        <input type="button"  value="yellow" onclick="demo2()">
        <input type="button"  value="green" onclick="demo3()">

    </body>
        
        
</html>
